name: Chrome Web Store release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      operation:
        description: Check API access without changing the store, or submit a version tag
        type: choice
        options: [status, publish]
        default: status
        required: true

permissions:
  contents: read

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release ref
        env:
          OPERATION: ${{ inputs.operation || 'publish' }}
        run: |
          if [ "$OPERATION" = publish ]; then
            [[ "$GITHUB_REF" == refs/tags/v* ]] || { echo 'Publishing requires a version tag'; exit 1; }
            git merge-base --is-ancestor HEAD origin/main || { echo 'Release commit must be on main'; exit 1; }
          else
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Run the status check from main'; exit 1; }
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
      - name: Check publishing configuration
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
          PUBLISHER: ${{ vars.CWS_PUBLISHER_ID }}
          EXTENSION: ${{ vars.CWS_EXTENSION_ID }}
        run: |
          for setting in PROVIDER SERVICE_ACCOUNT PUBLISHER EXTENSION; do
            [ -n "${!setting}" ] || { echo "Missing $setting; follow docs/releases.md"; exit 1; }
          done
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
          export_environment_variables: false
      - name: Submit or check status
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          OPERATION: ${{ inputs.operation || 'publish' }}
        run: |
          if [ "$OPERATION" = status ]; then
            node scripts/webstore.mjs --status
          else
            node scripts/webstore.mjs
          fi
